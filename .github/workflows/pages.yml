name: Check and deploy Pack 12 Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pack12-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inventory original navigation, downloads, frames, and PDF destinations
        run: |
          python -m pip install pypdf==6.1.1
          python scripts/audit_source.py
      - name: Preserve source assets and build static site
        run: python scripts/build.py
      - name: Check source content and all local destinations
        run: python scripts/check.py
      - name: Install browser checks
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check mobile, tablet, and desktop layouts
        run: python scripts/browser_check.py
      - name: Upload preview and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack12-preview
          path: |
            dist/
            screenshots/
            source-audit/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
